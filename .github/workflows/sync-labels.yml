name: Sync Labels

on:
  workflow_dispatch:
    inputs:
      repos:
        description: |
          Comma-separated target repos (e.g. ricelintw/repo1,ricelintw/repo2).
          Leave empty to use the default: ricelintw/laborhero.
        required: false
        default: "ricelintw/laborhero"

jobs:
  sync:
    name: Sync labels from labels.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert labels.yml to JSON
        run: |
          python3 - <<'EOF'
          import json, yaml
          with open('labels.yml') as f:
              data = yaml.safe_load(f)
          with open('/tmp/labels.json', 'w') as f:
              json.dump(data['labels'], f, ensure_ascii=False)
          EOF

      - name: Sync labels to target repos
        uses: actions/github-script@v7
        env:
          TARGET_REPOS: ${{ github.event.inputs.repos }}
        with:
          github-token: ${{ secrets.SYNC_LABELS_PAT }}
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('/tmp/labels.json', 'utf8'));
            const repos = process.env.TARGET_REPOS
              .split(',')
              .map(r => r.trim())
              .filter(Boolean);

            for (const full of repos) {
              const [owner, repo] = full.split('/');
              core.info(`\n▶ Syncing labels to ${owner}/${repo}`);

              const existing = await github.paginate(
                github.rest.issues.listLabelsForRepo,
                { owner, repo, per_page: 100 }
              );
              const existingMap = new Map(existing.map(l => [l.name, l]));

              for (const label of labels) {
                const params = {
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description ?? '',
                };
                if (existingMap.has(label.name)) {
                  await github.rest.issues.updateLabel(params);
                  core.info(`  updated  ${label.name}`);
                } else {
                  await github.rest.issues.createLabel(params);
                  core.info(`  created  ${label.name}`);
                }
              }
              core.info(`Done: ${owner}/${repo}`);
            }
            core.info('\nAll repos synced.');
